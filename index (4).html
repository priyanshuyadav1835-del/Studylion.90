<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Lion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+Devanagari:wght@600;700&family=Hind:wght@400;600&display=swap">
<style>
:root{--s:#08110c;--s2:#0d1c14;--b:#143f29;--g:#22c55e;--gold:#f2b84b;--t:#f3faf5;--m:#8fb5a0;--f:'Playfair Display','Noto Serif Devanagari',serif}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(90% 45% at 50% 16%,#0b3a21 0,#04100a 55%,#020605 100%) fixed;color:var(--t);font-family:'Hind','Noto Sans Devanagari',system-ui,sans-serif}
h1,h2,h3,.big,.card b{font-family:var(--f)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px 14px 28px}
.ib{width:48px;height:48px;border-radius:16px;background:#06130c;border:1px solid #17603a;color:var(--g);display:grid;place-items:center;box-shadow:0 0 14px #22c55e22}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;justify-content:space-between}
.home{text-align:center}
.badge{width:134px;height:134px;margin:-14px auto 0;border-radius:50%;background:radial-gradient(circle,#10331f,#030a06);border:3px solid #1c6b3f;box-shadow:0 0 36px #22c55e66,inset 0 0 18px #000;display:grid;place-items:center}
.lion{width:104px;height:104px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.home h1 span{display:block}
.wl{font-size:38px;font-weight:700;margin-top:24px;line-height:1.15}
.nm{font-size:52px;font-weight:900;color:var(--g);text-shadow:0 0 26px #22c55e88;line-height:1.1}
.tag{font-family:var(--f);font-weight:700;font-size:16px;margin:16px 0 28px}
.tag em{font-style:normal;color:var(--g)}
.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.app:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 8px;min-height:230px;background:linear-gradient(180deg,#0a150f,#060d09);border:1px solid #113423;border-radius:26px;font-family:var(--f);font-weight:700;font-size:16px;line-height:1.3}
.app:active{background:var(--s2)}
.app img{width:62%;aspect-ratio:1;object-fit:cover;border-radius:24%;border:2px solid #1f8a50;box-shadow:0 0 20px #22c55e55}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.top h2{flex:1;font-size:22px;font-weight:700}
.card{display:block;width:100%;text-align:left;background:linear-gradient(180deg,#0a150f,#060d09);border:1px solid #113423;border-radius:24px;padding:24px 22px;margin-bottom:12px}
.card:active{background:var(--s2)}
.card b{display:block;font-size:27px;font-weight:700}
.card span{color:var(--g);font-size:14px}
.off{opacity:.5}
.bg{padding:38px 24px}
.bg b{font-size:50px}
.sub{font-size:42px;font-weight:900;color:var(--g);text-shadow:0 0 22px #22c55e66;margin-bottom:4px}
.bn{color:var(--m);margin-bottom:14px}
.pw{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--b)}
.pw>*{position:absolute;inset:0;width:100%;height:100%}
#nowt{margin:12px 0 14px;font-weight:600}
#lec{list-style:none;padding:0;display:grid;gap:8px}
#lec button{width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--s);border:1px solid #113423}
#lec button.on{background:var(--g);color:#032013;font-weight:600}
.msg{color:var(--m);padding:20px 4px}
footer{text-align:center;padding:16px;color:var(--m);font-size:14px}
footer b{color:var(--gold)}
.dr{position:fixed;inset:0;display:none;background:#000a;z-index:9}
.dr.open{display:block}
.dr div{width:78%;max-width:300px;height:100%;background:var(--s);border-right:1px solid var(--b);padding:22px 18px}
.dr h3{font-size:22px;margin:6px 0 20px}
.dr p{padding:14px 0;border-top:1px solid var(--b)}
.dr small{color:var(--m)}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--b);padding:10px 18px;border-radius:14px;display:none;z-index:10}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){.lion{animation:none}}
.who{display:flex;align-items:center;gap:12px;margin:18px 0 4px}
.who img{width:52px;height:52px;border-radius:14px;border:2px solid #1f8a50;object-fit:cover}
.who b{font-family:var(--f);font-size:20px;display:block}
.who small{color:var(--m);font-family:var(--f)}
.mid{text-align:center;margin-top:10px}
.ul{width:90px;height:3px;border:0;background:var(--g);margin:4px auto 16px;border-radius:2px}
.bt{text-align:center;font-size:24px;margin-bottom:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tabs button{padding:14px;border-radius:16px;border:1px solid #113423;background:#060d09;font-family:var(--f);font-weight:700}
.tabs button.on{border-color:var(--g);color:var(--g)}
.sh2{font-family:var(--f);color:var(--g);font-size:22px;margin:18px 0 10px}
.row{width:100%;text-align:left;padding:18px 16px;border-radius:18px;border:1px solid #113423;background:#060d09;font-family:var(--f);font-weight:700;font-size:17px;margin-bottom:10px}
.row.on{border-color:var(--g);background:#0a1d12}
.sbody{margin-bottom:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<footer>Made by <b>Deepanshu</b></footer>

function play(x){
 const my=tok;
 if(x.cnt)list(Array(x.cnt).fill(0));
 setTimeout(()=>{if(my===tok&&!P){const n=document.getElementById('nowt');if(n)n.textContent='Video preview mein nahi chalta, live site par chalega.'}},8000);
 yt(()=>{
  if(my!==tok)return;
  const pv={rel:0,modestbranding:1,playsinline:1};let o;
  if(x.pl){pv.listType='playlist';pv.list=x.pl;o={playerVars:pv}}
  else{pv.playlist=x.v.slice(1).join(',');o={videoId:x.v[0],playerVars:pv}}
  o.events={onReady:()=>{let n=0;tm=setInterval(()=>{let l=P.getPlaylist&&P.getPlaylist();
    if(l&&l.length){clearInterval(tm);if(x.pl&&x.v){l=l.concat(x.v);P.cuePlaylist(l)}list(l)}
    else if(++n>30){clearInterval(tm);if(!x.cnt)document.getElementById('lec').innerHTML='<p class="msg">Lectures load nahi hue. Page refresh karo.</p>'}},600)},
   onStateChange:()=>{try{document.getElementById('nowt').textContent=P.getVideoData().title||'';const i=P.getPlaylistIndex();document.querySelectorAll('#lec button').forEach((e,j)=>e.classList.toggle('on',j===i))}catch(e){}}};
  P=new YT.Player('pl',o);
 });
}
function list(l){document.getElementById('lec').innerHTML=l.map((_,i)=>`<li><button onclick="P&&P.playVideoAt(${i});window.scrollTo(0,0)">Lecture ${i+1}</button></li>`).join('')}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
